# Use postgres/example user/password credentials

services:
  postgresql:
    container_name: "meucontainer"
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: minhasenha
    ports:
      - "5433:5432"
    volumes:
      - ./backups:/backups
      - ./entrypoint/database.sql:/docker-entrypoint-initdb.d/database.sql
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "seuemail@email.com"
      PGADMIN_DEFAULT_PASSWORD: "senha1"
    ports:
      - "8090:80"
    depends_on:
      - postgresql
